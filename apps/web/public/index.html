function Transcript({ L }) {
  const ref = useRef(null);
  const stick = useRef(true);
  const lang = viewLang(L);
  const isDemo = L.mode === 'demo';
  useAutoTranslate(isDemo ? DEMO.lines : L.lines, isDemo ? DEMO.clarity : (L.clarity && L.clarity.data), isDemo ? DEMO.id : L.id, lang, L.title);
  useEffect(() => { const el = ref.current; if (el && stick.current) el.scrollTop = el.scrollHeight; }, [L.lines.length, L.partial ? L.partial.text : '', lang, L.status, L.display]);
  const onScroll = e => { const el = e.currentTarget; stick.current = el.scrollHeight - el.scrollTop - el.clientHeight < 90; };
  return html`<div class="transcript" ref=${ref} onScroll=${onScroll}>
    ${lang !== S.me.outLang || L.viewAs !== 'me' ? html`<div class="viewas-note"><${Icon} n="users" size=${15} />Showing what ${speakerViewName(L)} sees, in ${langNative(lang)}. <button class="link" onClick=${() => setLive({ viewAs: 'me' })}>Back to mine</button></div>` : null}
    ${!L.lines.length && !L.partial ? html`<${Empty} state=${L.mode === 'mic' ? 'listen' : 'idle'} title=${L.mode === 'mic' ? (S.mic.state === 'listening' ? 'Bibbly is listening…' : 'Starting the mic…') : 'Waiting for someone to speak'}>${L.mode === 'mic' ? 'Start talking. Your words and their translation appear here.' : 'Captions will appear here.'}<//>` : null}
    ${L.lines.map(l => html`<${Caption} key=${l.id} line=${l} lang=${lang} display=${L.display} viewAs=${L.viewAs} />`)}
    ${L.partial ? html`<${Caption} key="partial" line=${L.partial} lang=${lang} display=${L.display} viewAs=${L.viewAs} partial=${true} />` : null}
    ${L.status === 'ended' ? html`<${EndCard} L=${L} lang=${lang} />` : null}
  </div>`;
}
function speakerViewName(L) {
  if (PEOPLE[L.viewAs]) return PEOPLE[L.viewAs].name;
  const p = S.room.peers.find(x => x.peer === L.viewAs);
  return p ? (p.nm || 'Guest') : 'you';
}

function Caption({ line, lang, display, viewAs, partial }) {
  const who = speakerOf(line, viewAs);
  const g = partial ? null : trGet(line, lang);
  const dirOf = c => (isRtl(c) ? 'rtl' : null);
  let body;
  if (partial) {
    body = html`<p class="cap-src live" lang=${langTag(line.lang)} dir=${dirOf(line.lang)}>${line.text}<span class="caret" aria-hidden="true"></span></p>`;
  } else if (g.same || display === 'orig') {
    body = html`<p class="cap-main" lang=${langTag(line.lang)} dir=${dirOf(line.lang)}>${line.text}</p>`;
  } else if (g.missing) {
    const can = claudeReady();
    body = [
      display !== 'tr' || !can ? html`<p class=${can ? 'cap-src' : 'cap-main'} lang=${langTag(line.lang)} dir=${dirOf(line.lang)}>${line.text}</p>` : null,
      can ? (g.status === 'error'
        ? html`<p class="cap-note">This line didn’t translate. <button class="link" onClick=${() => retryTranslation(line.id, lang)}>Retry</button></p>`
        : html`<p class="cap-main pending" aria-label="Translating"><span class="shimmer"></span><span class="shimmer short"></span></p>`)
        : html`<p class="cap-note">Translating into ${langNative(lang)} needs Claude in this view. The demo has English, 中文 and 日本語 built in.</p>`,
    ];
  } else {
    body = [
      html`<p class="cap-main" lang=${langTag(lang)} dir=${dirOf(lang)}>${g.text}</p>`,
      display === 'both' ? html`<p class="cap-src" lang=${langTag(line.lang)} dir=${dirOf(line.lang)}>${line.text}</p>` : null,
    ];
  }
  const detecting = partial ? line.detecting : (!!line.detecting && claudeReady() && !(g && g.status === 'error'));
  return html`<article class=${'cap' + (partial ? ' cap--partial' : '') + (line.sp === 'you' ? ' cap--me' : '')}>
    <${Avatar} name=${who.name} color=${who.color} />
    <div class="cap-body">
      <div class="cap-meta">
        <span class="cap-who">${who.label}</span>
        ${who.native ? html`<span class="cap-native" lang=${line.sp === 'sato' || line.sp === 'tanaka' ? 'ja' : 'zh-Hans'}>${who.native}</span>` : null}
        <span class="cap-time tnum">${fmtClock(line.t)}</span>
        <${LangChip} line=${line} detecting=${detecting} />
      </div>
      ${body}
    </div>
  </article>`;
}

function EndCard({ L, lang }) {
  const cl = L.mode === 'demo' ? demoClarity(L.lines.length, true) : (L.clarity && L.clarity.data);
  const langsUsed = [...new Set(L.lines.flatMap(l => l.langs || [l.lang]))];
  return html`<div class="endcard">
    <${Mascot} state="happy" size=${76} />

      <p>${pluralize(L.lines.length, 'line')} in ${langsUsed.map(spokenName).join(', ')}.${cl ? ` Bibbly found ${pluralize(cl.actions.length, 'action item')} and ${pluralize(cl.decisions.length, 'decision')}.` : ''}</p>
    </div>
    <div class="endcard-actions">

function LiveDock({ L }) {
  return html`<div class="live-dock">${liveControls(L, true)}</div>`;
}

function ClarityPanel({ L }) {
  const lang = viewLang(L);
  const isDemo = L.mode === 'demo';
  const cl = isDemo ? demoClarity(L.lines.length, L.status === 'ended') : (L.clarity && L.clarity.status === 'done' ? L.clarity.data : null);
  const working = !isDemo && L.clarity && L.clarity.status === 'working';
  const note = isDemo ? { id: 'n1', date: Date.now(), clKey: DEMO.id, people: DEMO.people, langs: ['zh', 'en', 'ja'] }
    : { id: L.savedId || L.id, date: L.startedAt, clKey: L.id, people: ['you'], langs: [...new Set(L.lines.map(l => l.lang))] };
  return html`<div class="clarity">
    <div class="cl-head"><${Mascot} state=${working ? 'think' : liveMascot(L)} size=${56} />
      <div><h2 class="h3">Clarity</h2><p class="muted sm">${isDemo ? (L.status === 'ended' ? 'Final notes' : 'Updates while people talk') : 'Summary, decisions and to-dos'}</p></div></div>
    ${!isDemo ? html`<div class="cl-gen"><button class="btn sm" disabled=${!claudeReady() || working || !L.lines.length} onClick=${summarizeLive}><${Icon} n="sparkle" />${working ? 'Bibbly is thinking…' : cl ? 'Refresh the notes' : 'Summarize so far'}</button>
      ${!claudeReady() ? html`<p class="hint">Summaries need Claude in this view.</p>` : !L.lines.length ? html`<p class="hint">Say something first.</p>` : null}</div>` : null}
    ${cl ? html`<${ClarityBody} cl=${cl} lang=${lang} note=${note} live=${true} />` : isDemo ? html`<p class="cl-empty" lang=${langTag(CL_LABELS[lang] ? lang : 'en')}>${clLabel(lang, 'none')}</p>` : null}
  </div>`;
}

function ClarityBody({ cl, lang, note, live }) {
  const key = note.clKey || note.id;
  const tx = (item, id) => { const r = clT(item, lang, id); return html`<span class=${r.fallback ? 'fb' : ''} lang=${langTag(r.fallback ? (item.src || 'en') : lang)} dir=${isRtl(r.fallback ? 'en' : lang) ? 'rtl' : null}>${r.text}</span>`; };
  const hasAny = cl.summary.length || cl.decisions.length || cl.actions.length || cl.event;
  if (!hasAny) return html`<p class="cl-empty">No summary yet.</p>`;
  return html`<div class=${'clb' + (live ? ' live' : '')}>
    ${cl.summary.length ? html`<section class="clb-sec"><h3 class="clb-h" lang=${langTag(CL_LABELS[lang] ? lang : 'en')}>${clLabel(lang, 'summary')}</h3>
      <ul class="clb-list">${cl.summary.map((it, i) => html`<li key=${'s' + i}>${tx(it, `${key}.s${i}`)}</li>`)}</ul></section>` : null}
    ${cl.decisions.length ? html`<section class="clb-sec"><h3 class="clb-h" lang=${langTag(CL_LABELS[lang] ? lang : 'en')}>${clLabel(lang, 'decisions')}</h3>
      <ul class="clb-list dec">${cl.decisions.map((it, i) => html`<li key=${'d' + i}><${Icon} n="tick" size=${15} />${tx(it, `${key}.d${i}`)}</li>`)}</ul></section>` : null}
    ${cl.actions.length ? html`<section class="clb-sec"><h3 class="clb-h" lang=${langTag(CL_LABELS[lang] ? lang : 'en')}>${clLabel(lang, 'actions')}</h3>
      <ul class="clb-actions">${cl.actions.map(a => {
        const due = actionDue(a, note.date);
        const added = S.tasks.some(t => t.src && t.src.action === a.id && t.src.note === note.id);
        return html`<li key=${a.id} class="act">
          <${Avatar} name=${a.owner === 'you' ? S.me.name : ownerLabel(a, 'en')} color=${a.owner === 'you' ? 'var(--sp-you)' : (PEOPLE[a.owner] ? PEOPLE[a.owner].color : 'var(--sp-x)')} size=${28} />
          <div class="act-body"><span class="act-owner" lang=${langTag(lang)}>${ownerLabel(a, lang)}</span><span class="act-text">${tx(a, `${key}.a.${a.id}`)}</span>${due ? html`<${DueChip} due=${due} />` : null}</div>
          <button class=${'icon-btn sm add' + (added ? ' done' : '')} aria-label=${added ? 'Already in your tasks' : 'Add to my tasks'} title=${added ? 'In your tasks' : 'Add to my tasks'} onClick=${() => addActionAsTask(a, note, lang)}><${Icon} n=${added ? 'tick' : 'plus'} size=${16} /></button>
        </li>`;
      })}</ul></section>` : null}
    ${cl.event ? html`<section class="clb-sec"><h3 class="clb-h" lang=${langTag(CL_LABELS[lang] ? lang : 'en')}>${clLabel(lang, 'followup')}</h3>
      <div class="clb-event"><span class="ev-ic"><${Icon} n="calendar" /></span><div class="ev-txt"><b>${tx(cl.event, `${key}.ev`)}</b><span>${fmtWhen(cl.event.whenAbs || +dueFrom(note.date, cl.event.when))}</span></div>
        <button class="btn sm" onClick=${() => addEventFromClarity(cl.event, note)}>Add to calendar</button></div></section>` : null}
  </div>`;
}
const fmtWhen = ms => `${relDay(ms)} · ${fmtTime(ms)}`;

function MiniCaptions() {

/* ============================================================
   Tasks
   ============================================================ */
const FILTERS = [{ id: 'today', label: 'Today' }, { id: 'upcoming', label: 'Upcoming' }, { id: 'meetings', label: 'From meetings' }, { id: 'reminders', label: 'Reminders' }, { id: 'someday', label: 'Someday' }, { id: 'done', label: 'Done' }];
const TASK_PICK = {
  today: t => !t.done && t.due && dayDiff(t.due) <= 0, upcoming: t => !t.done && t.due && dayDiff(t.due) > 0, meetings: t => !t.done && !!t.src,
  reminders: t => !t.done && t.remind, someday: t => !t.done && !t.due, done: t => t.done,
};
function TasksView() {
  const f = S.ui.taskFilter;
  const counts = Object.fromEntries(FILTERS.map(x => [x.id, S.tasks.filter(TASK_PICK[x.id]).length]));
  const list = S.tasks.filter(TASK_PICK[f] || TASK_PICK.today).sort((a, b) => (f === 'done' ? (b.doneAt || 0) - (a.doneAt || 0) : (a.due || 9e15) - (b.due || 9e15)));
  const groups = [];
  if (f === 'someday' || f === 'done') { if (list.length) groups.push({ title: f === 'done' ? 'Completed' : 'No date yet', items: list }); }
  else {
    const map = new Map();
    list.forEach(t => { const n = t.due ? dayDiff(t.due) : 99; const title = !t.due ? 'No date' : n < 0 ? 'Overdue' : relDay(t.due); if (!map.has(title)) map.set(title, []); map.get(title).push(t); });
    map.forEach((items, title) => groups.push({ title, items }));
  }
  return html`<div class="page tasks">
    <header class="page-head"><div><h1 class="h1">Tasks</h1><p class="lede">Your to-dos and reminders, including everything you agreed to in meetings.</p></div>
      <${Mascot} state=${counts.today ? 'idle' : 'happy'} size=${80} /></header>
    <${QuickAdd} />
    <div class="filters" role="tablist" aria-label="Task lists">${FILTERS.map(x => html`<button role="tab" aria-selected=${f === x.id ? 'true' : 'false'} class=${'fchip' + (f === x.id ? ' on' : '')} onClick=${() => setUI({ taskFilter: x.id })}>${x.label}<span class="fcount tnum">${counts[x.id]}</span></button>`)}</div>
    ${groups.map(g => html`<section class="tgroup" key=${g.title}><h2 class=${'tg-title' + (g.title === 'Overdue' ? ' late' : '')}>${g.title}</h2><ul class="tlist">${g.items.map(t => html`<li key=${t.id}><${TaskRow} t=${t} /></li>`)}</ul></section>`)}
    ${!list.length ? html`<${Empty} state=${f === 'today' ? 'happy' : 'sleep'} title=${f === 'today' ? 'All clear for today.' : 'Nothing here yet.'}>${f === 'today' ? 'Bibbly adds anything new from your meetings.' : 'Add a task above, or let Bibbly pull to-dos from your meetings.'}<//>` : null}
    <div class="tasks-foot"><button class="btn ghost sm" onClick=${previewReminder}><${Icon} n="bell" />Preview a reminder</button></div>
  </div>`;
}

function TaskRow({ t }) {
  const note = t.src ? S.notes.find(n => n.id === t.src.note) : null;
  const c = LISTS[t.list] || 'var(--lagoon)';
  return html`<div class=${'task' + (t.done ? ' done' : '')}>

function QuickAdd({ compact }) {
  const v = S.ui.quick;
  const p = v.trim() ? parseQuick(v) : null;
  const d = S.caps.dictation;
  const listening = dictTarget === 'task' && S.mic.state !== 'idle';
  const submit = e => {
    e.preventDefault();
    const t = addTask(v);
    if (t) { setUI({ quick: '' }); toast(`Added “${t.title}”${t.due ? ` for ${relDay(t.due).toLowerCase()}` : ''}.`, { mascot: 'happy' }); }
  };
  const speak = () => {
    if (!d) { toast('Voice input works in Chrome or Edge and in the Claude desktop app.'); return; }
    if (d.active()) { d.stop().catch(() => {}); return; }
    dictTarget = 'task';
    const o = dictOptions();
    let pr;
    try { pr = o ? d.start(o) : d.start(); } catch (err) { pr = Promise.reject(err); }
    pr.catch(err => { dictTarget = 'live'; if (err && err.code !== 'stopped') toast(micReasonText(err.code)); });
  };
  return html`<form class=${'quick' + (compact ? ' compact' : '')} onSubmit=${submit}>
    <div class="quick-row">
      <${Icon} n="plus" />
      <input id=${compact ? 'quick-add-today' : 'quick-add'} class="quick-input" autocomplete="off" aria-label="New task"
        placeholder=${listening ? (S.ui.quickPartial || 'Listening…') : (compact ? 'Add a task…' : 'Add a task, e.g. “Send deck to Li Wei tomorrow 3pm”')}
        value=${v} onInput=${e => setUI({ quick: e.target.value })} />
      ${d ? html`<button type="button" class=${'icon-btn' + (listening ? ' rec' : '')} aria-label=${listening ? 'Stop voice input' : 'Say a task'} onClick=${speak}><${Icon} n="mic" /></button>` : null}
      <button class="btn primary sm" type="submit" disabled=${!v.trim()}>Add</button>
    </div>
    ${p ? html`<div class="quick-preview" aria-live="polite">
        ${p.due ? html`<span class="chip"><${Icon} n="calendar" size=${12} />${relDay(p.due)}${hasTime(p.due) ? ' ' + fmtTime(p.due) : ''}</span>` : html`<span class="chip">No date</span>`}
        ${p.remind ? html`<span class="chip"><${Icon} n="bell" size=${12} />Reminder</span>` : null}
        <span class="chip"><span class="dot" style=${`--c:${LISTS[p.list]}`}></span>${p.list}</span><span class="qp-title">${p.title}</span></div>`
      : compact ? null : html`<p class="hint">Bibbly understands “tomorrow 3pm”, “Fri”, “tonight”, “in 3 days” and #work, #home or #personal.${claudeReady() ? ' Other languages work too, e.g. “明天下午三点给李伟发报价”.' : ''}</p>`}
  </form>`;
}

const H0 = 8, H1 = 21, HPX = 52;
function updateEvent(id, p) { set({ events: S.events.map(e => (e.id === id ? { ...e, ...p } : e)) }); }
function deleteEvent(id) { set({ events: S.events.filter(e => e.id !== id), ui: { ...S.ui, sheet: null } }); toast('Event deleted.'); }
function CalendarView() {
  const ws = addDays(weekStart(TODAY), S.ui.calWeek * 7);
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const sel = new Date(S.ui.calDay + 'T00:00:00');
  const evOn = d => S.events.filter(e => sameDay(e.start, d)).sort((a, b) => a.start - b.start);
  const dueOn = d => S.tasks.filter(t => t.due && !t.done && sameDay(t.due, d));
  const sameMonth = days[0].getMonth() === days[6].getMonth();
  const range = `${days[0].toLocaleDateString('en', { month: 'short', day: 'numeric' })} – ${days[6].toLocaleDateString('en', sameMonth ? { day: 'numeric' } : { month: 'short', day: 'numeric' })}`;
  const hours = [...Array(H1 - H0)].map((_, i) => H0 + i);
  const now = new Date();
  const nowTop = (now.getHours() + now.getMinutes() / 60 - H0) * HPX;
  const evStyle = e => { const s = new Date(e.start); const top = Math.max(0, (s.getHours() + s.getMinutes() / 60 - H0) * HPX); const h = Math.max(24, (e.dur / 60) * HPX - 3); return `top:${top}px;height:${h}px;--h:${e.personal ? 12 : PLATFORMS[e.plat].hue}`; };
  return html`<div class="page cal">
    <header class="page-head cal-head">
      <div><h1 class="h1">Calendar</h1><p class="lede">Meetings Bibbly joins and translates, plus tasks with a due date.</p></div>
      <div class="cal-ctrl">
        <button class="icon-btn" aria-label="Previous week" onClick=${() => setUI({ calWeek: S.ui.calWeek - 1, calDay: isoDay(addDays(sel, -7)) })}><${Icon} n="left" /></button>
        <span class="cal-range tnum">${range}</span>
        <button class="icon-btn" aria-label="Next week" onClick=${() => setUI({ calWeek: S.ui.calWeek + 1, calDay: isoDay(addDays(sel, 7)) })}><${Icon} n="right" /></button>
        <button class="btn sm" onClick=${() => setUI({ calWeek: 0, calDay: isoDay(TODAY) })}>Today</button>
        <button class="btn primary sm" onClick=${() => openSheet({ type: 'newEvent', day: S.ui.calDay })}><${Icon} n="plus" />Event</button>
      </div>
    </header>

    <div class="weekstrip" role="tablist" aria-label="Days">${days.map(d => {
      const n = evOn(d).length + dueOn(d).length;
      return html`<button role="tab" aria-selected=${sameDay(d, sel) ? 'true' : 'false'} class=${'wday' + (sameDay(d, sel) ? ' on' : '') + (sameDay(d, now) ? ' today' : '')} onClick=${() => setUI({ calDay: isoDay(d) })}>
        <span>${d.toLocaleDateString('en', { weekday: 'short' })}</span><b class="tnum">${d.getDate()}</b><i class="dots">${[...Array(Math.min(3, n))].map(() => html`<em></em>`)}</i></button>`;
    })}</div>

    <div class="day-agenda">
      <h2 class="h3">${relDay(sel)}${dayDiff(sel) < -1 || dayDiff(sel) > 6 ? '' : ', ' + sel.toLocaleDateString('en', { month: 'short', day: 'numeric' })}</h2>
      <ul class="da-list">
        ${evOn(sel).map(e => html`<li key=${e.id}><button class=${'da-ev' + (e.personal ? ' personal' : '')} style=${`--h:${e.personal ? 12 : PLATFORMS[e.plat].hue}`} onClick=${() => openSheet({ type: 'event', id: e.id })}>
          <span class="da-time tnum">${fmtTime(e.start)}<small>${e.dur} min</small></span>
          <span class="da-body"><b>${e.title}</b><span>${PLATFORMS[e.plat].name}${e.langs ? ' · ' + e.langs.map(spokenName).join(', ') : ''}</span></span>
          ${e.bibbly ? html`<span class="badge-bb" title="Bibbly translates this meeting"><${Mascot} state="idle" size=${26} /></span>` : null}</button></li>`)}
        ${dueOn(sel).map(t => html`<li key=${t.id}><button class="da-task" onClick=${() => openSheet({ type: 'task', id: t.id })}><${Icon} n="check" size=${16} /><span><b>${t.title}</b><span>Due${hasTime(t.due) ? ' ' + fmtTime(t.due) : ''}</span></span></button></li>`)}
        ${!evOn(sel).length && !dueOn(sel).length ? html`<li class="muted">Nothing planned. Bibbly suggests a long lunch.</li>` : null}
      </ul>
    </div>

    <div class="wg" role="grid" aria-label="Week">
      <div class="wg-head"><span class="wg-corner"></span>${days.map(d => html`<button class=${'wg-day' + (sameDay(d, now) ? ' today' : '')} onClick=${() => setUI({ calDay: isoDay(d) })}><span>${d.toLocaleDateString('en', { weekday: 'short' })}</span><b class="tnum">${d.getDate()}</b></button>`)}</div>
      <div class="wg-due"><span class="wg-corner">Due</span>${days.map(d => html`<div class="wg-duecell">${dueOn(d).slice(0, 2).map(t => html`<button class="wg-task" onClick=${() => openSheet({ type: 'task', id: t.id })} title=${t.title}>${t.title}</button>`)}${dueOn(d).length > 2 ? html`<span class="wg-more">+${dueOn(d).length - 2}</span>` : null}</div>`)}</div>
      <div class="wg-body" style=${`height:${(H1 - H0) * HPX}px`}>
        <div class="wg-times">${hours.map(h => html`<span style=${`top:${(h - H0) * HPX}px`}>${h === 12 ? '12 PM' : h > 12 ? `${h - 12} PM` : `${h} AM`}</span>`)}</div>
        ${days.map(d => html`<div class=${'wg-col' + (sameDay(d, now) ? ' today' : '')}>
          ${evOn(d).filter(e => new Date(e.start).getHours() < H1).map(e => html`<button key=${e.id} class=${'wg-ev' + (e.dur < 45 ? ' short' : '') + (e.personal ? ' personal' : '') + (e.start + e.dur * 6e4 < Date.now() ? ' past' : '')} title=${`${e.title}, ${fmtTime(e.start)}`} style=${evStyle(e)} onClick=${() => openSheet({ type: 'event', id: e.id })}>
            <b>${e.title}</b><span class="tnum">${fmtTime(e.start)}${e.bibbly ? ' · Bibbly' : ''}</span></button>`)}
          ${sameDay(d, now) && nowTop > 0 && nowTop < (H1 - H0) * HPX ? html`<span class="now-line" style=${`top:${nowTop}px`}></span>` : null}
        </div>`)}
      </div>
    </div>
  </div>`;
}

function Sheet({ title, children, wide }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const prev = document.activeElement;
    if (el) { const f = el.querySelector('.sheet-body button, .sheet-body input, .sheet-body select, .sheet-body textarea') || el.querySelector('button'); if (f) f.focus({ preventScroll: true }); }
    const onKey = e => { if (e.key === 'Escape') closeSheet(); };
    window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus({ preventScroll: true }); };
  }, []);
  return html`<div class="scrim" onClick=${e => { if (e.target === e.currentTarget) closeSheet(); }}>
    <div class=${'sheet' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title} ref=${ref}>
      <div class="sheet-head"><h2 class="h3">${title}</h2><button class="icon-btn" aria-label="Close" onClick=${closeSheet}><${Icon} n="x" /></button></div>
      <div class="sheet-body">${children}</div>
    </div>
  </div>`;
}

function TaskSheet({ id }) {

function SendSheet({ sheet }) {
  const note = S.notes.find(n => n.id === sheet.note);
  if (!note) return null;
  const d = sheet.dest;
  const m = exportModel(note, sheet.lang, { orig: false, clarity: true });
  const connected = !!S.connect[d];
  const simulateSend = () => {
    set({ notes: S.notes.map(n => (n.id === note.id ? { ...n, sent: [...new Set([...(n.sent || []), d])] } : n)), ui: { ...S.ui, sheet: { ...sheet, sent: true } } });
    toast(`Sent to ${APPS[d].name} (simulated).`, { mascot: 'happy' });
  };
  return html`<${Sheet} title=${'Send to ' + APPS[d].name} wide=${true}>
    <p class="muted">Bibbly posts this to <b>${DEST_TARGET[d]}</b>${connected ? '.' : ` once ${APPS[d].name} is connected.`}</p>
    <${DestPreview} d=${d} m=${m} note=${note} />
    ${sheet.sent ? html`<div class="notice ok"><${Icon} n="tick" />Done (simulated). The real app would put this in ${DEST_TARGET[d]}.</div>` : null}
    <div class="sheet-actions">
      <button class="btn ghost" onClick=${() => copyText(toMarkdown(m), 'Markdown')}><${Icon} n="copy" />Copy instead</button>
      ${connected ? html`<button class="btn primary" disabled=${!!sheet.sent} onClick=${simulateSend}><${Icon} n="send" />${sheet.sent ? 'Sent' : 'Send (simulated)'}</button>`
        : html`<button class="btn primary" onClick=${() => { set({ connect: { ...S.connect, [d]: true } }); toast(APPS[d].name + ' connected (simulated).'); }}><${Icon} n="link" />Connect ${APPS[d].name}</button>`}
    </div>
  <//>`;
}
function CopySheet({ sheet }) {
  const ref = useRef(null);
  return html`<${Sheet} title=${sheet.title} wide=${true}>
    <p class="muted">Select the text and copy it with your keyboard or the menu.</p>

function Toast() {
  const t = S.ui.toast;
  if (!t) return null;
  if (t.kind === 'reminder') {
    const task = S.tasks.find(x => x.id === t.task);
    return html`<div class="toast reminder" role="alertdialog" aria-label="Reminder">
      <${Mascot} state="wave" size=${46} />
      <div class="toast-text"><span class="eyebrow">${t.preview ? 'Reminder preview' : 'Reminder'}${task && task.due && hasTime(task.due) ? ' · ' + fmtTime(task.due) : ''}</span><b>${t.text}</b></div>
      <div class="toast-actions"><button class="btn sm" onClick=${() => snoozeTask(t.task)}>Snooze 10 min</button>
        <button class="btn primary sm" onClick=${() => { if (task && !task.done) toggleTask(t.task); else closeToast(); }}>Done</button></div>
    </div>`;
  }
  return html`<div class="toast" role="status">
    ${t.mascot ? html`<${Mascot} state=${t.mascot} size=${34} />` : null}
    <span class="toast-text">${t.text}</span>
    ${t.action ? html`<button class="btn sm" onClick=${() => { closeToast(); t.action.fn(); }}>${t.action.label}</button>` : null}
    <button class="icon-btn sm" aria-label="Dismiss" onClick=${closeToast}><${Icon} n="x" size=${15} /></button>
  </div>`;
}

        ${[['mic', 'Meeting', 'Captions in every language'], ['sparkle', 'Clarity', 'Decisions and action items'], ['check', 'Tasks and reminders', 'Your to-dos, with times'], ['calendar', 'Calendar', 'Follow-ups land here'], ['notes', 'Prep', 'Last time’s notes, before the next call']].map(([ic, t, s]) => html`<li class="loop-node"><span class="loop-ic"><${Icon} n=${ic} /></span><b>${t}</b><small>${s}</small></li>`)}

      <p class="bp-p">Voice memos feed the same loop: “book flights to Tokyo and remind me to call Mom on Sunday” becomes a task and a reminder, in whatever language you said it. Try it on the Stick page by importing the voice memo.</p>
    </section>

    <section class="bp-sec" id="bp-mascot">
      <h2 class="h2">Meet Bibbly</h2>
      <p class="bp-p">Bibbly is a jelly-soft speech bubble with a curled tail. It hears babble and turns it into clear words. A small spark floats above its head and changes with whatever Bibbly is doing.</p>
      <div class="sheet-grid">${[['idle', 'Ready'], ['listen', 'Listening'], ['translate', 'Translating'], ['think', 'Thinking'], ['happy', 'Done!'], ['sleep', 'Resting']].map(([s, l]) => html`<figure class="pose"><${Mascot} state=${s} size=${112} /><figcaption>${l}</figcaption></figure>`)}</div>
      <div class="bp-two">
        <div><h3 class="h4">Personality</h3><p>Curious, calm and quick. Bibbly loves a good conversation, never interrupts, and gets visibly happy when a to-do is ticked off. It speaks in short, clear sentences, which is the whole point.</p>
          <h3 class="h4">Signature details</h3><ul class="bp-list">
            <li>Speech-bubble body with a curled tail</li><li>A floating spark: a star when ready, sound bars when listening, dots when thinking, “z” when resting</li>
            <li>An A⇄文 badge that lights up while translating</li><li>Smooth seafoam finish with an ink outline, coral cheeks</li></ul></div>
        <div><h3 class="h4">Palette</h3><ul class="swatches">
          <li><span style="--c:var(--bb-body)"></span>Seafoam<small>body</small></li><li><span style="--c:var(--bb-line)"></span>Ink<small>outline</small></li>
          <li><span style="--c:var(--bb-cheek)"></span>Coral<small>cheeks</small></li><li><span style="--c:var(--sun)"></span>Sun<small>spark</small></li><li><span style="--c:var(--lagoon)"></span>Lagoon<small>app accent</small></li></ul></div>

      <h3 class="h4">How Bibbly stays original</h3>
      <div class="table-wrap"><table class="bp-table">

    <section class="bp-sec" id="bp-ip">
      <h2 class="h2">Name and IP guardrails</h2>
      <ul class="bp-list check">
        <li><b>The name is the bigger risk.</b> “Bibbly” is one letter away from the character that inspired it. Before spending on branding, run a trademark clearance search with the USPTO (US), EUIPO (EU), WIPO’s Global Brand Database and the offices in your launch markets, such as IPOS (Singapore), CNIPA (China) and JPO (Japan). Check classes 9 (software and hardware), 42 (software as a service) and 38 (communications).</li>
        <li><b>Get a short opinion from an IP lawyer</b> on likelihood of confusion, and clear one or two backup names at the same time.</li>
        <li><b>China is first-to-file.</b> Register the name, the mascot and a Chinese brand name early. Avoid Chinese names that sound like existing brands, such as 哔哩哔哩 (Bilibili).</li>
        <li><b>Keep the design history.</b> Dated sketches and files show Bibbly was created independently. Never trace or reference frames from the film.</li>
        <li><b>Protect the mascot.</b> Register it as a figurative trademark, and register copyright in the artwork where that’s available, as in the US.</li>
        <li><b>In public, leave the inspiration out.</b> No “Barbie”, “Fairytopia” or “Bibble” in app-store text, ads, keywords or pitch decks.</li>
      </ul>
      <p class="hint">A starting checklist, not legal advice.</p>
    </section>

    <section class="bp-sec" id="bp-privacy">
      <h2 class="h2">Privacy, consent and trust</h2>
      <ul class="bp-list">
        <li><b>Recording is always visible:</b> the in-app banner, Bibbly’s listening pose and the Stick’s lights. One tap pauses.</li>
        <li><b>Consent:</b> recording laws differ, and some places require everyone’s consent. When Bibbly joins a call it posts a notice in the chat, and participants can opt out of transcription.</li>
        <li><b>Data stays in its region:</b> encrypted in transit and at rest. China’s PIPL restricts sending personal data abroad, and the EU’s GDPR sets strict rules as well.</li>
        <li><b>Company controls:</b> single sign-on, retention rules, and admin export and delete.</li>
        <li><b>On-device mode</b> for sensitive meetings, using smaller models at somewhat lower accuracy.</li>
        <li><b>No training on customer audio</b> without an explicit opt-in.</li>
      </ul>
    </section>

    <section class="bp-sec" id="bp-market">
      <h2 class="h2">Where Bibbly fits</h2>
      <div class="market">
        <div><h3 class="h4">Built into meeting apps</h3><p>Teams, Zoom, Google Meet and Lark offer live captions, with translated captions on some plans. Each one works only inside its own app.</p></div>
        <div><h3 class="h4">AI note-takers</h3><p>Otter, Fireflies, tl;dv and Feishu Minutes write strong notes. Translation is secondary.</p></div>
        <div><h3 class="h4">AI recorders</h3><p>PLAUD and iFlytek devices capture in-person audio and summarise it.</p></div>
        <div><h3 class="h4">Translator gadgets</h3><p>Timekettle earbuds and pocket translators handle conversations, not meetings and notes.</p></div>
      </div>
      <p class="callout"><b>Bibbly’s edge:</b> one assistant for every platform and the meeting room, where each person reads their own language. It’s excellent at Mandarin–English mixing, turns talk into tasks, reminders and calendar entries, and has a character people like.</p>
    </section>

    <section class="bp-sec" id="bp-roadmap">
      <h2 class="h2">Roadmap</h2>
      <ol class="phases">
        <li><span class="ph-when">4–6 weeks</span><h3 class="h4">Validate</h3><p>Test this prototype with 15–20 bilingual teams. Benchmark speech engines on real recorded meetings with Mandarin–English mixing. Pick the first market and meeting platform.</p></li>
        <li><span class="ph-when">About 3–4 months</span><h3 class="h4">MVP</h3><p>iOS, Android, Windows and macOS apps. Live captions with a language per person, notes, summaries and action items. Exports, Notion and Slack. Tasks, reminders, and calendar sync with Google and Outlook.</p></li>
        <li><span class="ph-when">About 3 more months</span><h3 class="h4">Teams</h3><p>Rooms with guest links and QR codes. Zoom and Teams side-panel apps, the browser extension, Lark and Google. Team workspaces, admin controls and single sign-on.</p></li>
        <li><span class="ph-when">9–15 months, alongside</span><h3 class="h4">Bibbly Stick</h3><p>Industrial design, EVT, DVT and PVT builds, certification and manufacturing. Launch bundled with Bibbly Pro.</p></li>
      </ol>
      <div class="bp-two">
        <div><h3 class="h4">Suggested stack</h3><ul class="bp-list">
          <li><b>Apps:</b> React Native for iOS and Android, Tauri or Electron for desktop, sharing one TypeScript core. Flutter is a good single-codebase alternative. Native modules capture the computer’s audio.</li>
          <li><b>Backend:</b> a real-time gateway over WebSockets or WebRTC, speech engines behind one interface so you can mix providers per language, Claude for translation polish and Clarity, Postgres and object storage, deployed per region.</li></ul></div>
        <div><h3 class="h4">Business model</h3><ul class="bp-list">
          <li>Free: limited minutes per month</li><li>Pro: for individuals, unlimited captions and exports</li><li>Team: per seat, with admin and integrations</li><li>Bibbly Stick: bundled with a Pro subscription</li></ul></div>
      </div>
    </section>

    <section class="bp-sec" id="bp-decide">
      <h2 class="h2">Decisions for you</h2>
      <ul class="bp-list decide">
        <li>Which market and language pair first: Singapore and Malaysia, mainland China, or Japan?</li>
        <li>Which meeting platform first: Zoom, Teams or Lark?</li>
        <li>Cloud first, or on-device options from day one for privacy-sensitive buyers?</li>
        <li>Launch the Stick with version 1, or after the app finds its audience?</li>
        <li>Does “Bibbly” clear a trademark search, or do you need the backup name?</li>
      </ul>
      <div class="bp-end"><${Mascot} state="happy" size=${88} /><p>Everything on this page can be tried in the prototype: the demo meeting on Live, exports in Notes, the voice memo on the Stick page, and real captions across two devices in the Bibbly room.</p>
        <button class="btn primary" onClick=${() => go('live')}><${Icon} n="mic" />Back to Live</button></div>
    </section>
  </div>`;
