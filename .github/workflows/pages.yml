name: Website

# Publishes apps/web/public (the interactive prototype) to GitHub Pages.
# One-time setup: Settings → Pages → Source: GitHub Actions. Custom domain: see apps/web/README.md.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/public
      - id: deploy
        uses: actions/deploy-pages@v4
